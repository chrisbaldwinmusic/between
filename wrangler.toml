name = "between"
# worker/gate.js puts the pre-launch PIN in front of the Astro worker (dist/_worker.js).
main = "./worker/gate.js"
compatibility_date = "2026-09-21"

[assets]
directory = "./dist"
binding = "ASSETS"
# Every request goes through worker/gate.js first, so static pages are PIN-gated too.
run_worker_first = true

[[kv_namespaces]]
binding = "VENUE_KV"
id = "2202b52bbf514acebf0fa67f5bf4713e"
preview_id = "78f18b42723a401b8a3444298e9cbd7f"

[[d1_databases]]
binding = "OPS_DB"
database_name = "between-ops"
database_id = "e7cc1aba-58a7-411d-8809-54b7d5f46baa"
