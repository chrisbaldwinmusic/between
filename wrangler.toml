name = "between"
# worker/gate.js sits in front of the Astro worker (dist/_worker.js) to count tracked visits and run the cron.
main = "./worker/gate.js"
compatibility_date = "2026-09-21"

[assets]
directory = "./dist"
binding = "ASSETS"
# Every request goes through worker/gate.js first (visit counting).
run_worker_first = true

[[kv_namespaces]]
binding = "VENUE_KV"
id = "2202b52bbf514acebf0fa67f5bf4713e"
preview_id = "78f18b42723a401b8a3444298e9cbd7f"

[[d1_databases]]
binding = "OPS_DB"
database_name = "between-ops"
database_id = "e7cc1aba-58a7-411d-8809-54b7d5f46baa"

# Daily reminder digest for the leads (src/lib/reminders.js), 07:00 UTC = 8am BST / 7am GMT.
# Sends through Resend; needs the RESEND_API_KEY secret.
# Facebook + Instagram for /team/social (src/lib/meta.js). Ids only; the token is a secret:
#   npx wrangler secret put META_ACCESS_TOKEN
# TODO: Facebook Page id and the linked Instagram professional account id.
[vars]
META_PAGE_ID = "324865194048984"
META_IG_USER_ID = "17841467325593092"

# The shared mailer's live D1 (sibling Mailer repo, database "mailer"). Used ONLY for a COUNT of active
# subscribers in src/lib/mailer.js (/team/evaluation fill button). D1 bindings can't be read-only, so keep
# every query against it to aggregate counts: never select names or emails.
[[d1_databases]]
binding = "MAILER_DB"
database_name = "mailer"
database_id = "2819811e-6b22-4f12-8b7e-81ca5b1d0354"

[triggers]
crons = ["0 7 * * *"]

# Team photo / screenshot uploads (/team/media). Private: served only through /api/team/media.
[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "between-evidence"
