<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Offline · Between Ops</title>
  <style>
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #1A1212; color: #C9BFBA; font: 16px/1.5 -apple-system, Arial, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 26rem; }
    h1 { color: #F4EFEA; font: 700 1.5rem/1.2 Georgia, serif; margin: 0 0 .5rem; }
    button { font: inherit; font-weight: 700; color: #1A1212; background: #E8A23D; border: 0; border-radius: 6px; padding: .7rem 1.1rem; min-height: 44px; margin-top: 1rem; cursor: pointer; }
    button:focus-visible { outline: 3px solid #F4EFEA; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Between Ops needs a connection to show the latest schedule, to-dos and stories. Try again when you've got signal or Wi-Fi.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
